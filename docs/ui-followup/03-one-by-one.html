<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>追问方案 03 · 一次一问</title>
<style>
  :root{--bg:#06070c;--s1:#0b0e15;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);
    --ink:#eef1f7;--sub:#9aa4b4;--dim:#626c7c;--indigo:#8b9cff;--mint:#6fe3c0;--amber:#f0b872;
    --sans:"Inter","Segoe UI","Microsoft YaHei",system-ui,sans-serif;--mono:ui-monospace,"Cascadia Code",Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 var(--sans)}
  .glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(720px 500px at 70% 20%,rgba(139,156,255,.12),transparent 62%)}
  .nav{display:flex;align-items:center;gap:12px;padding:16px 30px;border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}
  .brand i{width:12px;height:12px;border-radius:3px;background:var(--ink);position:relative}
  .brand i::after{content:"";position:absolute;inset:3.5px;background:var(--bg);border-radius:1px}
  .brand small{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:var(--dim)}
  .nav .right{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:9px;color:var(--dim)}
  .nav a{color:var(--dim);text-decoration:none}.nav a:hover{color:var(--ink)}
  .stage{position:relative;display:grid;grid-template-columns:1.02fr .98fr;gap:40px;max-width:1240px;margin:0 auto;padding:34px 30px 60px;align-items:start}
  .label{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
  h1{font-size:clamp(28px,3vw,38px);letter-spacing:-.04em;line-height:1.15;margin:8px 0 8px}
  .sub{color:var(--sub);font-size:13px;margin:0 0 20px}
  .panel{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  textarea{width:100%;min-height:74px;background:none;border:none;outline:none;color:var(--ink);resize:vertical;font:14px/1.7 var(--sans)}
  .fields{display:flex;flex-wrap:wrap;gap:6px;padding-top:12px;border-top:1px solid var(--line);margin-top:6px}
  .fld{display:flex;align-items:baseline;gap:6px;border:1px solid var(--line);border-radius:6px;padding:5px 9px;color:var(--dim)}
  .fld span{font-family:var(--mono);font-size:8.5px}
  .fld b{font-family:var(--mono);font-size:11px;color:var(--ink);font-weight:500}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;align-items:center}
  .chips>span{font-family:var(--mono);font-size:8.5px;color:var(--dim);margin-right:2px}
  .chips b{font-size:10.5px;font-weight:500;color:var(--ink);border:1px solid var(--line2);background:rgba(255,255,255,.06);border-radius:6px;padding:4px 9px}
  .chips i{font-size:10.5px;font-style:normal;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:4px 9px}
  .cta-row{display:flex;gap:10px;margin-top:16px;align-items:center}
  .btn{font-size:12px;font-weight:600;color:#0a0b0d;background:var(--ink);border:1px solid var(--ink);border-radius:7px;padding:8px 14px;cursor:pointer}
  .ghost{font-size:11.5px;color:var(--sub);border:1px solid var(--line2);border-radius:7px;padding:7px 12px;background:none;cursor:pointer}
  .hint{font-size:10px;color:var(--dim)}

  /* 一次一问 */
  .focus{background:linear-gradient(180deg,#0e121a,#0a0d13);border:1px solid var(--line2);border-radius:14px;padding:18px;position:sticky;top:24px}
  .focus-head{display:flex;align-items:center;gap:10px}
  .focus-head .dots{display:flex;gap:4px}
  .focus-head .dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.14)}
  .focus-head .dots i.on{background:var(--indigo);box-shadow:0 0 8px rgba(139,156,255,.6)}
  .focus-head .dots i.done{background:var(--mint)}
  .focus-head .step{margin-left:auto;font-family:var(--mono);font-size:8.5px;color:var(--dim)}
  .done-line{margin-top:10px;font-size:9.5px;color:var(--mint)}
  .q-big{font-size:clamp(20px,2.2vw,26px);letter-spacing:-.03em;line-height:1.35;margin:16px 0 4px;font-weight:600}
  .q-why{font-size:10.5px;color:var(--dim);margin-bottom:14px}
  .opt{display:block;border:1px solid var(--line);border-radius:9px;padding:11px 13px;margin-top:8px;cursor:pointer;transition:.15s}
  .opt:hover{border-color:var(--line2)}
  .opt input{display:none}
  .opt .t{display:flex;align-items:center;gap:9px;font-size:12.5px}
  .opt .t i{width:14px;height:14px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center}
  .opt .cons{font-size:10px;color:var(--dim);margin-top:3px;padding-left:23px}
  .opt:has(input:checked){border-color:rgba(139,156,255,.5);background:rgba(139,156,255,.07)}
  .opt:has(input:checked) i{border-color:var(--indigo)}
  .opt:has(input:checked) i::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--indigo)}
  .opt:has(input:checked) .cons{color:var(--indigo)}
  .focus-foot{display:flex;align-items:center;gap:8px;margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
  .focus-foot .ghost{margin-left:auto}
  .queue{margin-top:12px;padding:9px 11px;border:1px dashed var(--line2);border-radius:8px;font-size:9.5px;color:var(--dim);line-height:1.8}
  .queue b{color:var(--sub);font-weight:500}
  @media (max-width:980px){.stage{grid-template-columns:1fr;gap:20px;padding:22px 18px 50px}.focus{position:static}}
</style>
</head>
<body>
<div class="glow"></div>
<nav class="nav">
  <div class="brand"><i></i>行程协作 <small>FOLLOW-UP 03</small></div>
  <div class="right"><a href="index.html">← 全部方案</a><a href="03-one-by-one.html">重播</a></div>
</nav>

<main class="stage">
  <div>
    <div class="label">STEP 02 / 06</div>
    <h1>先说说这趟旅行。</h1>
    <p class="sub">一句话就够；字段用来补充。团队把真正不确定的点挑出来，一次只问一个。</p>
    <div class="panel">
      <textarea>成都 5 天，2 人，带 1 位老人，预算 8000，想看人文、吃点好的，节奏别太赶</textarea>
      <div class="fields">
        <div class="fld"><span>出发</span><b>上海</b></div>
        <div class="fld"><span>到达</span><b>成都</b></div>
        <div class="fld"><span>日期</span><b>11-20 → 11-24</b></div>
        <div class="fld"><span>人数</span><b>2</b></div>
        <div class="fld"><span>预算</span><b>8,000</b></div>
      </div>
      <div class="chips"><span>同行</span><b>老人</b><i>儿童</i><i>婴儿车</i></div>
      <div class="chips"><span>偏好</span><b>人文</b><b>美食</b><i>自然</i><i>购物</i><i>夜景</i></div>
      <div class="chips"><span>节奏</span><i>轻松</i><b>适中</b><i>紧凑</i></div>
    </div>
    <div class="cta-row">
      <button class="btn">确认后继续 →</button>
      <button class="ghost">跳过，用默认</button>
      <span class="hint">一共 3 个问题，约 30 秒</span>
    </div>
  </div>

  <aside class="focus">
    <div class="focus-head">
      <div class="dots"><i class="done"></i><i class="on"></i><i></i></div>
      <span class="step">问题 2 / 3</span>
    </div>
    <div class="done-line">● 上一题：老人能连续走 30 分钟</div>

    <div class="q-big">返程那天，你更想怎么走？</div>
    <div class="q-why">这决定最后一天是“用满”还是“留足时间”，也决定要不要 05:50 起床。</div>

    <label class="opt">
      <input type="radio" name="rv">
      <span class="t"><i></i>尽量早回</span>
      <span class="cons">代价：05:50 起床，前一晚 21:30 前必须睡</span>
    </label>
    <label class="opt">
      <input type="radio" name="rv" checked>
      <span class="t"><i></i>中午前后，别太赶</span>
      <span class="cons">代价：到家接近晚高峰</span>
    </label>
    <label class="opt">
      <input type="radio" name="rv">
      <span class="t"><i></i>傍晚再走，把最后一天用满</span>
      <span class="cons">代价：到家约 22:10，老人较累</span>
    </label>

    <div class="focus-foot">
      <button class="ghost">← 上一题</button>
      <button class="btn">下一题 →</button>
    </div>

    <div class="queue">接下来：<b>住宿位置</b> · 最后一晚要不要换到机场附近</div>
  </aside>
</main>
</body>
</html>
