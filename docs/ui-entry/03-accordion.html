<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入口方案 03 · 折叠</title>
<style>
  :root{
    --bg:#06070c; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
    --ink:#eef1f7; --sub:#9aa4b4; --dim:#626c7c; --indigo:#8b9cff; --mint:#6fe3c0;
    --sans:"Inter","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
  body{font:14px/1.65 var(--sans);overflow-x:hidden}
  .glow{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(760px 520px at 50% 28%,rgba(139,156,255,.13),transparent 65%)}
  .grid{position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:64px 64px;
    -webkit-mask-image:radial-gradient(800px 600px at 50% 30%,#000 15%,transparent 80%);
    mask-image:radial-gradient(800px 600px at 50% 30%,#000 15%,transparent 80%)}

  .nav{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:14px;padding:18px 30px}
  .brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}
  .brand i{width:12px;height:12px;border-radius:3px;background:var(--ink);position:relative}
  .brand i::after{content:"";position:absolute;inset:3.5px;background:var(--bg);border-radius:1px}
  .brand small{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:var(--dim)}
  .nav .right{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:9px;color:var(--dim)}
  .nav a{color:var(--dim);text-decoration:none}
  .nav a:hover{color:var(--ink)}

  .stage{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;padding:100px 24px 90px;text-align:center}
  .eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:9px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px rgba(111,227,192,.12)}
  h1{font-size:clamp(38px,4.6vw,60px);line-height:1.08;letter-spacing:-.05em;font-weight:600;margin:20px 0 14px}
  h1 span{color:var(--sub)}
  .lede{font-size:14px;color:var(--sub);line-height:1.85;max-width:30em;margin:0}
  .cta-row{display:flex;gap:12px;margin-top:26px;opacity:0;animation:fade .6s 2.9s forwards}
  @keyframes fade{to{opacity:1}}
  .btn{display:inline-flex;font-size:12.5px;font-weight:600;color:#0a0b0d;background:var(--ink);
    border:1px solid var(--ink);border-radius:8px;padding:9px 16px;text-decoration:none}
  .btn.ghost{background:transparent;color:var(--sub);border-color:var(--line2);font-weight:500}
  .btn:hover{background:#fff}
  .btn.ghost:hover{background:transparent;color:var(--ink);border-color:rgba(255,255,255,.3)}

  /* 折页 */
  .sheet-wrap{margin-top:52px;width:min(560px,92vw);perspective:1200px}
  .sheet{position:relative;border-radius:12px;transform:perspective(1200px) rotateX(7deg);transform-origin:top center;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.012));
    border:1px solid transparent;padding:0;transform-style:preserve-3d;
    animation:sheetIn .8s 1.4s forwards}
  @keyframes sheetIn{to{border-color:var(--line2);box-shadow:0 50px 90px -60px #000}}
  .sheet-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);
    opacity:0;animation:fade .5s 1.6s forwards}
  .sheet-head b{font-size:12px;font-weight:600}
  .sheet-head .v{font-family:var(--mono);font-size:9px;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
  .sheet-head .k{margin-left:auto;font-family:var(--mono);font-size:8.5px;color:var(--dim);letter-spacing:.08em}

  .fold{position:relative;transform-origin:top center;transform:rotateX(-92deg);
    animation:unfold .75s cubic-bezier(.2,.75,.2,1) forwards;
    animation-delay:calc(.5s + var(--i) * .2s)}
  @keyframes unfold{to{transform:rotateX(0)}}
  .fold::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(139,156,255,.35),transparent)}
  .fold:nth-of-type(2)::before{display:none}
  .fold .inner{display:grid;grid-template-columns:44px 30px 1fr 26px;gap:10px;align-items:center;
    padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.05);
    background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 45%);
    box-shadow:0 -10px 16px -14px #000}
  .fold:nth-of-type(odd) .inner{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01) 55%)}
  .fold:last-of-type .inner{border-bottom:none}
  .fold .d{font-family:var(--mono);font-size:9px;color:var(--dim);text-align:left}
  .fold .role{font-size:9px;font-weight:700;color:#0a0b0d;background:var(--c);border-radius:4px;text-align:center;padding:1px 0}
  .fold .line{height:1px;background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,.03))}
  .fold .end{font-family:var(--mono);font-size:9px;color:var(--dim);text-align:right}

  .sheet-foot{display:flex;justify-content:space-between;padding:11px 16px;
    font-family:var(--mono);font-size:8.5px;color:var(--dim);letter-spacing:.06em;
    opacity:0;animation:fade .6s 2.2s forwards}

  .foot{position:relative;z-index:2;display:flex;gap:16px;align-items:center;max-width:1080px;
    margin:0 auto;padding:10px 24px 26px;font-family:var(--mono);font-size:9px;color:var(--dim)}
  .foot .spacer{flex:1}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .fold{transform:none}
    .cta-row,.sheet-head,.sheet-foot{opacity:1}
    .sheet{border-color:var(--line2)}
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="grid"></div>

<nav class="nav">
  <div class="brand"><i></i>行程协作 <small>ENTRY 03</small></div>
  <div class="right">
    <a href="index.html">← 全部方案</a>
    <a href="03-accordion.html">重播</a>
  </div>
</nav>

<main class="stage">
  <div class="eyebrow"><i></i><span>multi-agent travel planning</span></div>
  <h1>先留白，<br><span>再排满。</span></h1>
  <p class="lede">五天可以塞得很满，也可以留出空档。折起来看，才知道哪一天太挤、哪一天值得多待。</p>
  <div class="cta-row">
    <a class="btn" href="http://127.0.0.1:8848/">开始规划</a>
    <a class="btn ghost" href="http://127.0.0.1:8848/?plan=6a58add7a739">看示例</a>
  </div>

  <div class="sheet-wrap" aria-hidden="true">
    <div class="sheet">
      <div class="sheet-head"><b>新行程</b><span class="v">v0</span><span class="k">DRAFT · 5 DAYS</span></div>
      <div class="fold" style="--i:0;--c:#8b9cff"><div class="inner"><span class="d">D1</span><span class="role">主</span><span class="line"></span><span class="end">—</span></div></div>
      <div class="fold" style="--i:1;--c:#f0b872"><div class="inner"><span class="d">D2</span><span class="role">交</span><span class="line"></span><span class="end">—</span></div></div>
      <div class="fold" style="--i:2;--c:#6fe3c0"><div class="inner"><span class="d">D3</span><span class="role">本</span><span class="line"></span><span class="end">—</span></div></div>
      <div class="fold" style="--i:3;--c:#c0a8ff"><div class="inner"><span class="d">D4</span><span class="role">审</span><span class="line"></span><span class="end">—</span></div></div>
      <div class="fold" style="--i:4;--c:#9ec5fe"><div class="inner"><span class="d">D5</span><span class="role">文</span><span class="line"></span><span class="end">—</span></div></div>
      <div class="sheet-foot"><span>5 DAYS · 0 SIGHTS · ¥0</span><span>AWAITING INPUT</span></div>
    </div>
  </div>
</main>

<footer class="foot">
  <span>方案 03 / 折叠</span>
  <span>一张纸逐层展开，每一层是一天</span>
  <span class="spacer"></span>
  <span>PURE CSS · NO JS</span>
</footer>
</body>
</html>
