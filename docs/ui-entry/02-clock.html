<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入口方案 02 · 时刻</title>
<style>
  :root{
    --bg:#06070c; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
    --ink:#eef1f7; --sub:#9aa4b4; --dim:#626c7c; --indigo:#8b9cff; --mint:#6fe3c0;
    --sans:"Inter","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
  body{font:14px/1.65 var(--sans);overflow:hidden}
  .glow{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(800px 500px at 50% 45%,rgba(139,156,255,.12),transparent 65%)}
  .hlines{position:fixed;inset:0;pointer-events:none;opacity:.35;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 56px);
    -webkit-mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);
    mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent)}

  .nav{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:14px;padding:18px 30px}
  .brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}
  .brand i{width:12px;height:12px;border-radius:3px;background:var(--ink);position:relative}
  .brand i::after{content:"";position:absolute;inset:3.5px;background:var(--bg);border-radius:1px}
  .brand small{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:var(--dim)}
  .nav .right{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:9px;color:var(--dim)}
  .nav a{color:var(--dim);text-decoration:none}
  .nav a:hover{color:var(--ink)}

  .stage{position:relative;z-index:2;height:100vh;display:flex;flex-direction:column;justify-content:center;
    max-width:1240px;margin:0 auto;padding:0 44px}

  .eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:9px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px rgba(111,227,192,.12)}
  h1{font-size:clamp(40px,4.8vw,66px);line-height:1.06;letter-spacing:-.05em;font-weight:600;margin:20px 0 16px}
  h1 span{color:var(--sub)}
  .lede{font-size:14px;color:var(--sub);line-height:1.85;max-width:28em;margin:0}
  .cta-row{display:flex;gap:12px;margin-top:26px;opacity:0;animation:fade .6s 3.4s forwards}
  @keyframes fade{to{opacity:1}}
  .btn{display:inline-flex;font-size:12.5px;font-weight:600;color:#0a0b0d;background:var(--ink);
    border:1px solid var(--ink);border-radius:8px;padding:9px 16px;text-decoration:none}
  .btn.ghost{background:transparent;color:var(--sub);border-color:var(--line2);font-weight:500}
  .btn:hover{background:#fff}
  .btn.ghost:hover{background:transparent;color:var(--ink);border-color:rgba(255,255,255,.3)}

  /* 时间轴 */
  .axis-wrap{position:relative;margin-top:64px;height:170px}
  .axis{position:absolute;left:0;right:0;top:70px;height:1px;background:var(--line2)}
  .tick{position:absolute;top:-5px;width:1px;height:11px;background:rgba(255,255,255,.18)}
  .tick span{position:absolute;top:-24px;left:50%;transform:translateX(-50%);
    font-family:var(--mono);font-size:8.5px;color:var(--dim)}
  .sweep{position:absolute;top:-70px;height:210px;width:1px;left:0;
    background:linear-gradient(180deg,transparent,rgba(139,156,255,.9),transparent);
    box-shadow:0 0 24px rgba(139,156,255,.6);animation:sweep 4.2s linear forwards}
  @keyframes sweep{0%{left:0;opacity:1}92%{opacity:1}100%{left:100%;opacity:0}}
  .marker{position:absolute;top:-6px;left:var(--p);transform:translateX(-50%);text-align:center;opacity:.25}
  .marker i{display:block;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);margin:0 auto 10px}
  .marker b{display:block;font-family:var(--mono);font-size:9px;font-weight:500;color:var(--sub)}
  .marker small{display:block;font-family:var(--mono);font-size:8px;color:var(--dim);margin-top:2px}
  .marker{animation:light .4s var(--d) forwards}
  @keyframes light{to{opacity:1}}
  .marker i{animation:dot .3s var(--d) forwards}
  @keyframes dot{to{background:var(--indigo);box-shadow:0 0 12px rgba(139,156,255,.8)}}

  .axis-note{position:absolute;left:0;bottom:-6px;margin:0;font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.08em}

  .foot{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:16px;align-items:center;
    max-width:1240px;margin:0 auto;padding:16px 44px;font-family:var(--mono);font-size:9px;color:var(--dim)}
  .foot .spacer{flex:1}

  @media (max-width:900px){
    body{overflow:auto}
    .stage{height:auto;padding:100px 22px 90px}
    .axis-wrap{margin-top:48px;height:190px}
    h1{font-size:38px}
    .foot{position:static;padding:0 22px 24px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .cta-row{opacity:1}
    .marker{opacity:1}
    .sweep{display:none}
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="hlines"></div>

<nav class="nav">
  <div class="brand"><i></i>行程协作 <small>ENTRY 02</small></div>
  <div class="right">
    <a href="index.html">← 全部方案</a>
    <a href="02-clock.html">重播</a>
  </div>
</nav>

<main class="stage">
  <div class="eyebrow"><i></i><span>multi-agent travel planning</span></div>
  <h1>时间先走，<br><span>方案再定。</span></h1>
  <p class="lede">一天从几点开始、到几点结束，决定了这趟旅行是赶还是慢。先看时间，再谈安排。</p>
  <div class="cta-row">
    <a class="btn" href="http://127.0.0.1:8848/">开始规划</a>
    <a class="btn ghost" href="http://127.0.0.1:8848/?plan=6a58add7a739">看示例</a>
  </div>

  <div class="axis-wrap" aria-hidden="true">
    <div class="axis">
      <span class="tick" style="left:0%"><span>08</span></span>
      <span class="tick" style="left:14.3%"><span>10</span></span>
      <span class="tick" style="left:28.6%"><span>12</span></span>
      <span class="tick" style="left:42.9%"><span>14</span></span>
      <span class="tick" style="left:57.2%"><span>16</span></span>
      <span class="tick" style="left:71.5%"><span>18</span></span>
      <span class="tick" style="left:85.8%"><span>20</span></span>
      <span class="tick" style="left:100%"><span>22</span></span>
      <div class="sweep"></div>
      <div class="marker" style="--p:16%;--d:.67s"><i></i><b>D1</b><small>抵达</small></div>
      <div class="marker" style="--p:34%;--d:1.43s"><i></i><b>D2</b><small>城市</small></div>
      <div class="marker" style="--p:52%;--d:2.18s"><i></i><b>D3</b><small>近郊</small></div>
      <div class="marker" style="--p:70%;--d:2.94s"><i></i><b>D4</b><small>雨天</small></div>
      <div class="marker" style="--p:88%;--d:3.7s"><i></i><b>D5</b><small>返程</small></div>
    </div>
    <div class="axis-note">A DAY HAS A SHAPE · 08:00 — 22:00</div>
  </div>
</main>

<footer class="foot">
  <span>方案 02 / 时刻</span>
  <span>一根时间线扫过，五天依次亮起</span>
  <span class="spacer"></span>
  <span>PURE CSS · NO JS</span>
</footer>
</body>
</html>
