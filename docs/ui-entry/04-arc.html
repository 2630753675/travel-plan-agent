<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入口方案 04 · 航线</title>
<style>
  :root{
    --bg:#06070c; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
    --ink:#eef1f7; --sub:#9aa4b4; --dim:#626c7c; --indigo:#8b9cff; --mint:#6fe3c0;
    --sans:"Inter","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
  body{font:14px/1.65 var(--sans);overflow:hidden}
  .glow{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(900px 560px at 62% 45%,rgba(139,156,255,.12),transparent 65%)}
  .topo{position:fixed;inset:-6%;pointer-events:none;opacity:.5;transition:transform .6s ease;
    background:
      repeating-radial-gradient(circle at 72% 38%,transparent 0 38px,rgba(255,255,255,.05) 38px 39px),
      repeating-radial-gradient(circle at 18% 78%,transparent 0 46px,rgba(255,255,255,.035) 46px 47px);
    -webkit-mask-image:radial-gradient(900px 700px at 60% 40%,#000 10%,transparent 75%);
    mask-image:radial-gradient(900px 700px at 60% 40%,#000 10%,transparent 75%)}
  .topo.b{opacity:.35;background:repeating-radial-gradient(circle at 80% 30%,transparent 0 64px,rgba(255,255,255,.04) 64px 65px)}
  .stage:hover .topo.a{transform:translate(-10px,-6px)}
  .stage:hover .topo.b{transform:translate(12px,8px)}

  .nav{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:14px;padding:18px 30px}
  .brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}
  .brand i{width:12px;height:12px;border-radius:3px;background:var(--ink);position:relative}
  .brand i::after{content:"";position:absolute;inset:3.5px;background:var(--bg);border-radius:1px}
  .brand small{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:var(--dim)}
  .nav .right{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:9px;color:var(--dim)}
  .nav a{color:var(--dim);text-decoration:none}
  .nav a:hover{color:var(--ink)}

  .stage{position:relative;z-index:2;height:100vh;display:grid;grid-template-columns:1fr 1fr;
    align-items:center;gap:30px;max-width:1320px;margin:0 auto;padding:0 44px}
  .eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:9px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px rgba(111,227,192,.12)}
  h1{font-size:clamp(38px,4.4vw,60px);line-height:1.08;letter-spacing:-.05em;font-weight:600;margin:20px 0 16px}
  h1 span{color:var(--sub)}
  .lede{font-size:14px;color:var(--sub);line-height:1.85;max-width:26em;margin:0}
  .cta-row{display:flex;gap:12px;margin-top:26px;opacity:0;animation:fade .6s 2.8s forwards}
  @keyframes fade{to{opacity:1}}
  .btn{display:inline-flex;font-size:12.5px;font-weight:600;color:#0a0b0d;background:var(--ink);
    border:1px solid var(--ink);border-radius:8px;padding:9px 16px;text-decoration:none}
  .btn.ghost{background:transparent;color:var(--sub);border-color:var(--line2);font-weight:500}
  .btn:hover{background:#fff}
  .btn.ghost:hover{background:transparent;color:var(--ink);border-color:rgba(255,255,255,.3)}

  .map{position:relative;height:520px}
  .map svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .arc{fill:none;stroke:url(#g);stroke-width:1.3;stroke-dasharray:1100;stroke-dashoffset:1100;
    animation:draw 2.4s .4s cubic-bezier(.3,.7,.3,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .port{fill:var(--bg);stroke:var(--indigo);stroke-width:1.3}
  .port-ring{fill:none;stroke:rgba(139,156,255,.3);stroke-width:1;animation:ring 3.2s ease-out infinite}
  @keyframes ring{0%{r:5;opacity:.8}100%{r:22;opacity:0}}
  .port-label{fill:var(--dim);font-family:var(--mono);font-size:9px;letter-spacing:.16em}
  .dot{opacity:0;animation:fade .6s 2.2s forwards}
  @keyframes fade{to{opacity:1}}

  .map-note{position:absolute;left:0;bottom:-8px;font-family:var(--mono);font-size:8.5px;color:var(--dim);letter-spacing:.1em}

  .foot{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:16px;align-items:center;
    max-width:1320px;margin:0 auto;padding:16px 44px;font-family:var(--mono);font-size:9px;color:var(--dim)}
  .foot .spacer{flex:1}

  @media (max-width:900px){
    body{overflow:auto}
    .stage{grid-template-columns:1fr;height:auto;padding:100px 22px 90px}
    .map{height:360px;order:-1}
    h1{font-size:38px}
    .foot{position:static;padding:0 22px 24px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .arc{stroke-dashoffset:0}
    .cta-row,.dot{opacity:1}
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="topo a"></div>
<div class="topo b"></div>

<nav class="nav">
  <div class="brand"><i></i>行程协作 <small>ENTRY 04</small></div>
  <div class="right">
    <a href="index.html">← 全部方案</a>
    <a href="04-arc.html">重播</a>
  </div>
</nav>

<main class="stage">
  <div>
    <div class="eyebrow"><i></i><span>multi-agent travel planning</span></div>
    <h1>两点之间，<br><span>不只是一条直线。</span></h1>
    <p class="lede">直飞最快，但未必最适合。五个角色会把路线、体力、预算和天气放在一起，再决定怎么走。</p>
    <div class="cta-row">
      <a class="btn" href="http://127.0.0.1:8848/">开始规划</a>
      <a class="btn ghost" href="http://127.0.0.1:8848/?plan=6a58add7a739">看示例</a>
    </div>
  </div>

  <div class="map" aria-hidden="true">
    <svg viewBox="0 0 640 520">
      <defs>
        <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="rgba(139,156,255,.15)"/>
          <stop offset=".5" stop-color="rgba(139,156,255,.9)"/>
          <stop offset="1" stop-color="rgba(111,227,192,.5)"/>
        </linearGradient>
      </defs>
      <path class="arc" d="M96 430 C 230 400, 300 300, 380 250 S 520 150, 560 116"/>
      <circle class="port" cx="96" cy="430" r="4"/>
      <circle class="port-ring" cx="96" cy="430" r="5"/>
      <circle class="port" cx="560" cy="116" r="4"/>
      <circle class="port-ring" cx="560" cy="116" r="5"/>
      <text class="port-label" x="76" y="456">ORIGIN</text>
      <text class="port-label" x="500" y="100">DESTINATION</text>
      <g class="dot">
        <circle r="2.6" fill="#eef1f7">
          <animateMotion dur="8s" repeatCount="indefinite"
            path="M96 430 C 230 400, 300 300, 380 250 S 520 150, 560 116"/>
        </circle>
        <circle r="8" fill="none" stroke="rgba(238,241,247,.25)">
          <animateMotion dur="8s" repeatCount="indefinite"
            path="M96 430 C 230 400, 300 300, 380 250 S 520 150, 560 116"/>
        </circle>
      </g>
    </svg>
    <div class="map-note">ONE ROUTE · MANY TRADE-OFFS</div>
  </div>
</main>

<footer class="foot">
  <span>方案 04 / 航线</span>
  <span>等高线与一条弧线，光点沿路走</span>
  <span class="spacer"></span>
  <span>PURE CSS + SVG · NO JS</span>
</footer>
</body>
</html>
