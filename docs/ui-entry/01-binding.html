<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入口方案 01 · 装订（v2）</title>
<style>
  :root{
    --bg:#06070c; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
    --ink:#eef1f7; --sub:#9aa4b4; --dim:#626c7c; --indigo:#8b9cff; --mint:#6fe3c0;
    --sans:"Inter","Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    --mono:ui-monospace,"Cascadia Code","SF Mono",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}
  body{font:14px/1.65 var(--sans);overflow:hidden}
  .grid{position:fixed;inset:0;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(900px 600px at 65% 35%,#000 10%,transparent 80%);
    mask-image:radial-gradient(900px 600px at 65% 35%,#000 10%,transparent 80%)}
  .aurora{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
  .aurora i:nth-child(1){width:520px;height:420px;right:6%;top:12%;background:rgba(139,156,255,.16);animation:drift 18s ease-in-out infinite alternate}
  .aurora i:nth-child(2){width:420px;height:360px;right:24%;bottom:8%;background:rgba(111,227,192,.09);animation:drift 22s ease-in-out -8s infinite alternate-reverse}
  .aurora i:nth-child(3){width:460px;height:380px;left:-6%;bottom:-10%;background:rgba(100,120,190,.12);animation:drift 26s ease-in-out -12s infinite alternate}
  @keyframes drift{from{transform:translate3d(-2%,-1%,0)}to{transform:translate3d(2%,2%,0)}}
  #field{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.85}
  body.has-canvas .motes{display:none}
  .motes{position:fixed;inset:0;pointer-events:none;z-index:1}
  .motes span{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(238,241,247,.35);
    animation:mote var(--t,16s) linear infinite;animation-delay:var(--d,0s)}
  @keyframes mote{0%{transform:translate3d(0,0,0);opacity:0}12%{opacity:.5}88%{opacity:.4}100%{transform:translate3d(var(--dx,20px),-120px,0);opacity:0}}


  /* ---------- 场景 ---------- */
  .scene{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .horizon{position:absolute;left:0;right:0;top:68%;height:1px;
    background:linear-gradient(90deg,transparent,rgba(139,156,255,.35),transparent);
    box-shadow:0 0 70px 14px rgba(139,156,255,.12)}
  .floor{position:absolute;left:-40%;right:-40%;top:68%;height:120%;transform-origin:top center;
    transform:perspective(620px) rotateX(64deg);
    background:
      repeating-linear-gradient(90deg,rgba(255,255,255,.075) 0 1px,transparent 1px 86px),
      repeating-linear-gradient(0deg,rgba(255,255,255,.055) 0 1px,transparent 1px 62px);
    -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.85),transparent 72%);
    mask-image:linear-gradient(180deg,rgba(0,0,0,.85),transparent 72%);
    opacity:.55;animation:floor 14s linear infinite}
  @keyframes floor{to{background-position:0 62px,0 0}}
  .rings{position:absolute;right:6%;top:46%;width:520px;height:520px;margin:-260px 0 0;
    transform:translateZ(0)}
  .rings i{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.06)}
  .rings .r1{border-style:dashed;border-color:rgba(139,156,255,.16);animation:spin 80s linear infinite}
  .rings .r2{inset:-70px;border-color:rgba(255,255,255,.045);animation:spin 120s linear infinite reverse}
  .rings .r3{inset:90px;border-color:rgba(111,227,192,.10);animation:spin 60s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .node{position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(196,208,238,.9);
    box-shadow:0 0 0 6px rgba(139,156,255,.08),0 0 18px rgba(139,156,255,.5);
    animation:pulse 3.6s ease-in-out infinite}
  .node.n1{right:14%;top:34%;animation-delay:-.4s}
  .node.n2{right:8%;top:62%;animation-delay:-1.6s;background:rgba(111,227,192,.9);box-shadow:0 0 0 6px rgba(111,227,192,.07),0 0 18px rgba(111,227,192,.5)}
  .node.n3{right:30%;bottom:16%;animation-delay:-2.4s}
  @keyframes pulse{0%,100%{transform:scale(.8);opacity:.5}50%{transform:scale(1.25);opacity:1}}
  .light{position:absolute;inset:-30%;pointer-events:none;
    background:linear-gradient(115deg,transparent 42%,rgba(255,255,255,.035) 50%,transparent 58%);
    transform:translateX(-18%);animation:light 13s ease-in-out infinite}
  @keyframes light{0%,100%{transform:translateX(-18%)}50%{transform:translateX(18%)}}
  .threads{position:absolute;inset:0;width:100%;height:100%}
  .threads path{fill:none;stroke:rgba(139,156,255,.3);stroke-width:1;
    stroke-dasharray:2 7;animation:flow 30s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-240}}
  .vignette{position:absolute;inset:0;
    background:
      linear-gradient(90deg,#06070c 0%,rgba(6,7,12,.88) 38%,rgba(6,7,12,0) 66%),
      radial-gradient(120% 90% at 50% 40%,transparent 45%,rgba(0,0,0,.55) 100%)}

  .nav{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:14px;padding:18px 30px}
  .brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}
  .brand i{width:12px;height:12px;border-radius:3px;background:var(--ink);position:relative}
  .brand i::after{content:"";position:absolute;inset:3.5px;background:var(--bg);border-radius:1px}
  .brand small{font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;color:var(--dim)}
  .nav .right{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:9px;color:var(--dim)}
  .nav a{color:var(--dim);text-decoration:none}
  .nav a:hover{color:var(--ink)}

  .stage{position:relative;z-index:2;height:100vh;display:grid;grid-template-columns:1fr 1fr;
    align-items:center;gap:40px;max-width:1280px;margin:0 auto;padding:0 40px}
  .eyebrow{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:9px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
  .eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 3px rgba(111,227,192,.12)}
  h1{font-size:clamp(40px,4.6vw,64px);line-height:1.06;letter-spacing:-.05em;font-weight:600;margin:22px 0 18px;position:relative}
  h1 span{display:block;color:var(--sub)}
  h1 .mask{display:block;overflow:hidden}
  h1 .mask > span{display:block;transform:translateY(110%);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
  h1 .mask:nth-of-type(2) > span{animation-delay:.12s}
  h1::after{content:"";position:absolute;left:0;bottom:-10px;height:1px;width:0;
    background:linear-gradient(90deg,var(--indigo),transparent);animation:underline 1s 1.1s forwards}
  @keyframes underline{to{width:260px}}
  @keyframes rise{to{transform:none}}
  .lede{font-size:14.5px;color:var(--sub);line-height:1.85;max-width:26em;opacity:0;animation:fade .8s .9s forwards}
  @keyframes fade{to{opacity:1}}
  .cta-row{display:flex;gap:12px;margin-top:28px;opacity:0;animation:fade .6s 2.7s forwards}
  .btn{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:#0a0b0d;
    background:var(--ink);border:1px solid var(--ink);border-radius:8px;padding:10px 17px;text-decoration:none}
  .btn.ghost{background:transparent;color:var(--sub);border-color:var(--line2);font-weight:500}
  .btn:hover{background:#fff}
  .btn.ghost:hover{color:var(--ink);border-color:rgba(255,255,255,.3);background:transparent}

  /* 面板 */
  .panel-wrap{position:relative;height:430px;display:flex;align-items:center;justify-content:center;perspective:900px}
  .sr{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .panel{position:relative;display:block;cursor:pointer;width:100%;max-width:470px;border-radius:14px;padding:10px 14px 8px;overflow:hidden;
    background:linear-gradient(180deg,rgba(16,20,29,.94),rgba(10,13,19,.96));backdrop-filter:blur(8px);
    border:1px solid transparent;transform:rotateY(-7deg) rotateX(2deg);
    transition:transform .5s ease,border-color .5s ease;animation:panelIn 1s .9s forwards}
  @keyframes panelIn{to{border-color:var(--line2);box-shadow:0 40px 90px -60px #000}}
  .panel-wrap:hover .panel{transform:rotateY(-2deg) rotateX(0deg)}
  .panel::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent)}
  .panel::after{content:"";position:absolute;top:-40%;bottom:-40%;left:-40%;width:36%;pointer-events:none;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.07),transparent);
    transform:rotate(8deg);animation:scan 9s 2.4s ease-in-out infinite}
  @keyframes scan{0%,55%{left:-45%}75%,100%{left:120%}}
  .spine{position:absolute;left:6px;top:10px;bottom:10px;width:1px;
    background:linear-gradient(180deg,var(--indigo),rgba(139,156,255,.05));
    transform-origin:top;transform:scaleY(0);animation:spine 1.2s 1.4s forwards}
  @keyframes spine{to{transform:scaleY(1)}}

  .strip{position:relative;display:grid;grid-template-columns:44px 32px 1fr 30px;gap:10px;align-items:center;
    padding:11px 8px 11px 14px;border-bottom:1px solid rgba(255,255,255,.05);
    opacity:0;transform:translateX(-34px);animation:strip .7s cubic-bezier(.2,.7,.2,1) forwards;
    animation-delay:calc(.25s + var(--i) * .13s);transition:background .2s,transform .2s}
  .strip:last-of-type{border-bottom:none}
  @keyframes strip{to{opacity:1;transform:none}}
  .strip .d{font-family:var(--mono);font-size:9px;color:var(--dim)}
  .strip .line{height:1px;background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,.03));transition:.25s}
  .strip .end{font-family:var(--mono);font-size:9px;color:var(--dim);text-align:right;transition:.2s}
  .strip .job{position:absolute;right:8px;font-size:9px;color:var(--sub);opacity:0;transform:translateX(6px);transition:.25s;pointer-events:none}
  .strip:hover{background:linear-gradient(90deg,rgba(255,255,255,.04),transparent 70%);transform:translateX(3px)}
  .strip:hover .line{background:linear-gradient(90deg,var(--c),rgba(255,255,255,.05));height:2px}
  .strip:hover .end{opacity:0;transform:translateX(-4px)}
  .strip:hover .job{opacity:1;transform:none}

  /* 角色印章 */
  .seal{position:relative;width:26px;height:26px;border-radius:7px;display:grid;place-items:center;
    font-size:10.5px;font-weight:700;color:#0a0b0d;background:var(--c);justify-self:start;isolation:isolate;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 12px -6px var(--c);
    transition:transform .2s,box-shadow .2s}
  .seal::after{content:"";position:absolute;inset:0;border-radius:7px;z-index:-1;
    background:linear-gradient(160deg,rgba(255,255,255,.35),transparent 55%);opacity:.6}
  .strip:hover .seal{transform:translateY(-1px) scale(1.06);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 8px 18px -6px var(--c)}
  .seal em{position:absolute;right:-4px;bottom:-4px;display:flex;align-items:flex-end;gap:1px;height:8px}
  .seal em b{display:block;width:2px;border-radius:1px;background:#0a0b0d;opacity:.8;
    animation:signal 1.6s ease-in-out infinite;animation-delay:calc(var(--j) * .18s)}
  .seal em b:nth-child(1){height:3px}
  .seal em b:nth-child(2){height:6px}
  .seal em b:nth-child(3){height:4px}
  @keyframes signal{0%,100%{transform:scaleY(.5);opacity:.35}50%{transform:scaleY(1);opacity:.8}}

  .panel-foot{display:flex;justify-content:space-between;padding:10px 8px 4px 14px;
    font-family:var(--mono);font-size:8.5px;color:var(--dim);letter-spacing:.08em;
    opacity:0;animation:fade .6s 2s forwards}
  .panel-foot .blink::after{content:"_";animation:blink 1.2s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}


  .ripple{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
    border:1px solid rgba(139,156,255,.6);opacity:0;pointer-events:none}
  .state-b{display:none;color:var(--mint)}
  #bind:checked ~ .stage .panel{animation:flash .7s ease-out}
  @keyframes flash{0%{box-shadow:0 0 0 0 rgba(139,156,255,.35)}100%{box-shadow:0 0 0 26px rgba(139,156,255,0)}}
  #bind:checked ~ .stage .spine{background:linear-gradient(180deg,#fff,rgba(139,156,255,.1));animation:strike .8s cubic-bezier(.2,.7,.2,1)}
  @keyframes strike{0%{transform:scaleY(0)}55%{transform:scaleY(1.03);filter:brightness(2)}100%{transform:scaleY(1)}}
  #bind:checked ~ .stage .seal{animation:stamp .45s both;animation-delay:calc(var(--i) * .06s)}
  @keyframes stamp{0%{transform:scale(1)}38%{transform:scale(1.16);filter:brightness(1.15)}100%{transform:scale(1)}}
  #bind:checked ~ .stage .ripple{animation:ripple .9s ease-out}
  @keyframes ripple{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(90)}}
  #bind:checked ~ .stage .state-a{display:none}
  #bind:checked ~ .stage .state-b{display:inline;animation:fade .4s .3s both}

  .foot{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:16px;align-items:center;
    max-width:1280px;margin:0 auto;padding:16px 40px;font-family:var(--mono);font-size:9px;color:var(--dim)}
  .foot .spacer{flex:1}

  @media (max-width:900px){
    body{overflow:auto}
    .stage{grid-template-columns:1fr;gap:26px;height:auto;padding:100px 22px 80px}
    .panel-wrap{height:360px}
    .foot{position:static;padding:0 22px 24px}
    h1{font-size:40px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    h1 .mask > span{transform:none}
    .lede,.cta-row,.strip,.panel-foot{opacity:1;transform:none}
    .panel{border-color:var(--line2)}
    .spine{transform:scaleY(1)}
    .panel::after{display:none}
  }
</style>
</head>
<body>
<input class="sr" type="checkbox" id="bind">
<canvas id="field" aria-hidden="true"></canvas>

<div class="scene" aria-hidden="true">
  <div class="horizon"></div>
  <div class="floor"></div>
  <div class="rings"><i class="r1"></i><i class="r2"></i><i class="r3"></i></div>
  <i class="node n1"></i>
  <i class="node n2"></i>
  <i class="node n3"></i>
  <div class="light"></div>
  <svg class="threads" viewBox="0 0 1440 960" preserveAspectRatio="none">
    <path d="M1440 70 C 1180 110, 930 230, 806 348"/>
    <path d="M1440 900 C 1180 850, 930 720, 806 628"/>

    <circle r="2.2" fill="rgba(196,208,238,.8)">

</div>

<div class="grid"></div>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="motes" aria-hidden="true">
  <span style="left:18%;top:70%;--t:15s;--d:-2s;--dx:18px"></span>
  <span style="left:32%;top:82%;--t:19s;--d:-7s;--dx:-14px"></span>
  <span style="left:47%;top:64%;--t:17s;--d:-4s;--dx:24px"></span>
  <span style="left:61%;top:76%;--t:21s;--d:-11s;--dx:-20px"></span>
  <span style="left:72%;top:58%;--t:16s;--d:-1s;--dx:12px"></span>
  <span style="left:81%;top:72%;--t:23s;--d:-9s;--dx:-26px"></span>
  <span style="left:24%;top:46%;--t:20s;--d:-13s;--dx:16px"></span>
  <span style="left:66%;top:38%;--t:18s;--d:-6s;--dx:-18px"></span>
</div>

<nav class="nav">

<main class="stage">
  <div class="copy">
    <div class="eyebrow"><i></i><span>multi-agent travel planning</span></div>
    <h1>
      <span class="mask"><span>旅行规划，</span></span>
      <span class="mask"><span>应该经得起审阅。</span></span>
    </h1>
    <p class="lede">说清需求，剩下的交给一支会分工、会复核的团队。方案可读、可改、可追溯。</p>
    <div class="cta-row">
      <a class="btn" href="http://127.0.0.1:8848/">开始规划</a>
      <a class="btn ghost" href="http://127.0.0.1:8848/?plan=6a58add7a739">看示例</a>
    </div>
  </div>

  <div class="panel-wrap">
    <label class="panel" for="bind" aria-label="点击装订">
      <span class="ripple"></span>
      <div class="spine"></div>

      <div class="strip" style="--i:0;--c:#8b9cff">
        <span class="d">D1</span>
        <span class="seal" style="--c:#8b9cff">主
          <em style="--j:0"><b></b><b></b><b></b></em>
        </span>
        <span class="line"></span>
        <span class="end">—</span>
        <span class="job">拆解任务</span>
      </div>

      <div class="strip" style="--i:1;--c:#f0b872">
        <span class="d">D2</span>
        <span class="seal" style="--c:#f0b872">交
          <em style="--j:1"><b></b><b></b><b></b></em>
        </span>
        <span class="line"></span>
        <span class="end">—</span>
        <span class="job">选航班与酒店</span>
      </div>

      <div class="strip" style="--i:2;--c:#6fe3c0">
        <span class="d">D3</span>
        <span class="seal" style="--c:#6fe3c0">本
          <em style="--j:2"><b></b><b></b><b></b></em>
        </span>
        <span class="line"></span>
        <span class="end">—</span>
        <span class="job">排逐日行程</span>
      </div>

      <div class="strip" style="--i:3;--c:#c0a8ff">
        <span class="d">D4</span>
        <span class="seal" style="--c:#c0a8ff">审
          <em style="--j:3"><b></b><b></b><b></b></em>
        </span>
        <span class="line"></span>
        <span class="end">—</span>
        <span class="job">复核硬约束</span>
      </div>

      <div class="strip" style="--i:4;--c:#9ec5fe">
        <span class="d">D5</span>
        <span class="seal" style="--c:#9ec5fe">文

<footer class="foot">

<script>
(() => {
  const canvas = document.getElementById('field')
  if (!canvas) return
  const ctx = canvas.getContext('2d')
  if (!ctx) return
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches
  const pointer = { x: -9999, y: -9999 }
  let w = 0, h = 0, parts = [], raf = 0, running = true

  function build() {
    const dpr = Math.min(2, window.devicePixelRatio || 1)
    w = window.innerWidth
    h = window.innerHeight
    canvas.width = Math.round(w * dpr)
    canvas.height = Math.round(h * dpr)
    canvas.style.width = w + 'px'
    canvas.style.height = h + 'px'
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    const count = Math.min(110, Math.round((w * h) / 16000))
    parts = Array.from({ length: count }, () => ({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.16,
      vy: (Math.random() - 0.5) * 0.16,
      r: Math.random() * 1.1 + 0.4,
      a: Math.random() * 0.35 + 0.18,
    }))
    if (reduce) drawOnce()
  }

  function drawOnce() {
    ctx.clearRect(0, 0, w, h)
    for (const p of parts) {
      ctx.beginPath()
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2)
      ctx.fillStyle = 'rgba(196,208,238,' + p.a + ')'
      ctx.fill()
    }
  }

  function frame() {
    if (!running) return
    ctx.clearRect(0, 0, w, h)
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i]
      p.x += p.vx
      p.y += p.vy
      if (p.x < -12) p.x = w + 12
      if (p.x > w + 12) p.x = -12
      if (p.y < -12) p.y = h + 12
      if (p.y > h + 12) p.y = -12

      const dx = p.x - pointer.x
      const dy = p.y - pointer.y
      const d2 = dx * dx + dy * dy
      if (d2 < 16000 && d2 > 1) {
        const d = Math.sqrt(d2)
        const f = (1 - d2 / 16000) * 0.9
        p.x += (dx / d) * f
        p.y += (dy / d) * f
      }

      for (let j = i + 1; j < parts.length; j++) {
        const q = parts[j]
        const ax = p.x - q.x
        const ay = p.y - q.y
        const dist2 = ax * ax + ay * ay
        if (dist2 < 11000) {
          const alpha = (1 - dist2 / 11000) * 0.12
          ctx.strokeStyle = 'rgba(139,156,255,' + alpha + ')'
          ctx.lineWidth = 0.6
          ctx.beginPath()
          ctx.moveTo(p.x, p.y)
          ctx.lineTo(q.x, q.y)
          ctx.stroke()
        }
      }

      ctx.beginPath()
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2)
      ctx.fillStyle = 'rgba(196,208,238,' + p.a + ')'
      ctx.fill()
    }
    raf = requestAnimationFrame(frame)
  }

  window.addEventListener('resize', build)
  window.addEventListener('pointermove', (e) => {
    pointer.x = e.clientX
    pointer.y = e.clientY
  })
  document.addEventListener('mouseleave', () => {
    pointer.x = -9999
    pointer.y = -9999
  })
  document.addEventListener('visibilitychange', () => {
    running = !document.hidden
    if (running && !reduce) {
      cancelAnimationFrame(raf)
      raf = requestAnimationFrame(frame)
    }
  })

  document.body.classList.add('has-canvas')
  build()
  if (!reduce) raf = requestAnimationFrame(frame)
})()
</script>
</body>
</html>
